<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>대전세종목공기술학원 방문 예약</title>
<meta name="description" content="대전세종목공기술학원 회원 방문 예약">
<meta property="og:title" content="대전세종목공기술학원 방문 예약">
<meta property="og:description" content="공방에 오는 날과 할 작업을 미리 알려 주세요">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22%3E%3Ctext y=%22.9em%22 font-size=%2290%22%3E🪚%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#f7f3ec; --card:#fffdf9; --ink:#2b2420; --muted:#6b5f55; --line:#e6ddd0;
    --wood:#a8693a; --wood-d:#7d4a25; --wood-l:#f1e3d3;
    --field:#fff6bf; --field-line:#e3c449; --field-focus:#fff0a0;
    --ok:#3d7a4f; --ok-l:#e2f0e5; --warn-l:#f7ecd5; --bad:#b0443a; --bad-l:#f6e0dd;
    --radius:12px;
  }
  *{box-sizing:border-box}
  body{margin:0;font-family:"Noto Sans KR",system-ui,sans-serif;background:var(--bg);color:var(--ink);font-size:17px;line-height:1.55}
  header{background:var(--wood-d);color:#fff;padding:16px 18px 0}
  header h1{margin:0;font-size:22px;font-weight:700;display:flex;align-items:baseline;flex-wrap:wrap;gap:4px 10px}
  header h1 .boss{font-size:16px;font-weight:500;opacity:.9}
  .acct{display:flex;align-items:center;flex-wrap:wrap;gap:8px;font-size:16px;margin:8px 0 14px;opacity:.95}
  .acct button{background:rgba(255,255,255,.18);color:#fff;border:1px solid rgba(255,255,255,.35);border-radius:8px;padding:4px 12px;font:inherit;font-size:15px;cursor:pointer}
  nav{display:flex;gap:4px;overflow-x:auto}
  nav button{background:transparent;border:0;color:#f3e6d8;padding:12px 16px;font:inherit;font-size:17px;font-weight:500;border-radius:10px 10px 0 0;cursor:pointer;white-space:nowrap}
  nav button.on{background:var(--bg);color:var(--wood-d);font-weight:700}
  nav .spacer{flex:1}
  nav .admin{opacity:.85;font-size:15px}
  main{max-width:1100px;margin:0 auto;padding:18px 14px 60px}
  .banner{background:var(--warn-l);color:#6b4e12;border:1px solid #ecd9ad;padding:10px 14px;border-radius:10px;font-size:15px;margin-bottom:16px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:18px}
  h2{font-size:20px;margin:0 0 6px}
  h3{font-size:18px;margin:18px 0 8px}
  label{display:block;font-size:17px;font-weight:700;color:var(--ink);margin:20px 0 8px}
  input,select,textarea{width:100%;font:inherit;font-size:18px;padding:13px 14px;border:2px solid var(--field-line);border-radius:12px;background:var(--field);color:var(--ink);min-height:52px}
  select{appearance:none;-webkit-appearance:none;background-image:linear-gradient(45deg,transparent 50%,var(--wood-d) 50%),linear-gradient(135deg,var(--wood-d) 50%,transparent 50%);background-position:calc(100% - 22px) 52%,calc(100% - 16px) 52%;background-size:6px 6px;background-repeat:no-repeat;padding-right:40px}
  textarea{min-height:90px;resize:vertical}
  input:focus,select:focus,textarea:focus{outline:3px solid var(--wood);outline-offset:0;background:var(--field-focus)}
  .dateday{margin-top:8px;font-size:18px;font-weight:700;color:var(--wood-d)}
  .timerow,.idrow{display:grid;grid-template-columns:1fr auto 1fr;gap:10px;align-items:center}
  .idrow{grid-template-columns:1.4fr 1fr}
  .timerow span{font-size:18px;font-weight:700;color:var(--muted)}
  .hint{font-size:15px;color:var(--muted);margin-top:6px}
  .hint.bad{color:var(--bad);font-weight:700}
  .chips{display:flex;flex-wrap:wrap;gap:8px}
  .chip{border:2px solid var(--line);background:#fff;border-radius:999px;padding:10px 16px;font:inherit;font-size:17px;cursor:pointer;color:var(--ink);min-height:46px}
  .chip.on{background:var(--wood);border-color:var(--wood);color:#fff;font-weight:700}
  .btn{background:var(--wood);color:#fff;border:0;border-radius:12px;padding:14px 20px;font:inherit;font-size:18px;font-weight:700;cursor:pointer;min-height:52px}
  .btn:hover{background:var(--wood-d)}
  .btn:disabled{opacity:.55;cursor:wait}
  .btn.block{width:100%}
  .btn.ghost{background:transparent;color:var(--wood-d);border:2px solid var(--line);font-weight:500}
  .btn.danger{background:transparent;color:var(--bad);border:2px solid var(--bad-l);font-weight:500}
  .btn.sm{padding:8px 14px;font-size:16px;min-height:42px}
  .actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:24px}
  .weekbar{display:flex;align-items:center;gap:8px;margin-bottom:12px;flex-wrap:wrap}
  .weekbar strong{font-size:18px;margin:0 6px}
  .weekbar input{width:auto}
  .weekbar .right{margin-left:auto}
  .grid{display:grid;grid-template-columns:repeat(7,minmax(140px,1fr));gap:6px;overflow-x:auto}
  .grid .h{font-size:16px;font-weight:700;text-align:center;padding:6px 0;color:var(--muted)}
  .grid .h.today{color:var(--wood-d)}
  .cell{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:6px;min-height:160px;display:flex;flex-direction:column;gap:5px}
  .cell.past{opacity:.55}
  .cell .cap{font-size:14px;color:var(--muted);text-align:right}
  .bk{background:var(--wood-l);border-radius:7px;padding:5px 8px;font-size:15px;cursor:pointer;border-left:4px solid var(--wood);line-height:1.4}
  .bk b{display:block}
  .bk .t{font-size:14px;color:var(--muted)}
  .bk.s-confirmed{background:var(--ok-l);border-color:var(--ok)}
  .bk.s-done{background:#ece9e4;border-color:#a39a90;color:var(--muted)}
  .bk.s-cancelled{background:var(--bad-l);border-color:var(--bad);text-decoration:line-through;opacity:.7}
  .tag{display:inline-block;font-size:14px;padding:2px 10px;border-radius:999px;background:var(--wood-l);color:var(--wood-d);font-weight:500}
  .tag.s-confirmed{background:var(--ok-l);color:var(--ok)}
  .tag.s-done{background:#ece9e4;color:var(--muted)}
  .tag.s-cancelled{background:var(--bad-l);color:var(--bad)}
  .stack{display:flex;flex-direction:column;gap:14px}
  .item{display:flex;gap:12px;padding:12px 0;border-bottom:1px dashed var(--line);align-items:flex-start;flex-wrap:wrap}
  .item:last-child{border-bottom:0}
  .item .who{min-width:96px;font-weight:700}
  .item .what{flex:1;min-width:180px}
  .item .meta{font-size:15px;color:var(--muted);font-weight:400}
  .item .note{background:var(--warn-l);border-radius:8px;padding:4px 10px;font-size:15px;margin-top:4px;display:inline-block}
  .item .btns{display:flex;gap:6px;flex-wrap:wrap}
  .sum{display:flex;gap:8px;flex-wrap:wrap}
  .sum .pill{background:#fff;border:1px solid var(--line);border-radius:10px;padding:8px 12px;font-size:16px}
  .sum .pill b{font-size:18px;color:var(--wood-d);margin-left:4px}
  table{width:100%;border-collapse:collapse;font-size:16px}
  th,td{text-align:left;padding:12px 8px;border-bottom:1px solid var(--line)}
  th{font-size:15px;color:var(--muted);font-weight:500}
  tr.click{cursor:pointer}
  tr.click:hover td{background:#fbf6ef}
  .empty{color:var(--muted);font-size:16px;padding:18px 0;text-align:center}
  .muted{color:var(--muted);font-size:15px;font-weight:400}
  .two{display:grid;grid-template-columns:1.2fr .8fr;gap:16px}
  @media(max-width:820px){.two{grid-template-columns:1fr}}
  .narrow{max-width:560px;margin:0 auto}
  .modal-bg{position:fixed;inset:0;background:rgba(40,28,18,.45);display:none;align-items:center;justify-content:center;padding:12px;z-index:20}
  .modal-bg.show{display:flex}
  .modal{background:var(--card);border-radius:14px;max-width:540px;width:100%;max-height:90vh;overflow:auto;padding:20px}
  .modal h2{display:flex;justify-content:space-between;align-items:flex-start;gap:8px}
  .x{background:none;border:0;font-size:28px;line-height:1;cursor:pointer;color:var(--muted)}
  dl{display:grid;grid-template-columns:80px 1fr;gap:8px 12px;margin:12px 0 0;font-size:17px}
  dt{color:var(--muted)}
  dd{margin:0}
  .toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;padding:12px 20px;border-radius:16px;font-size:17px;opacity:0;transition:opacity .2s;pointer-events:none;z-index:30;max-width:92vw;text-align:center}
  .toast.show{opacity:1}
  .hide{display:none!important}
</style>
</head>
<body>
<header>
  <h1>🪚 대전세종목공기술학원 <span class="boss">원장 이문회</span></h1>
  <div class="acct">
    <span>계좌번호 농협 <b>356-0252-9362-53</b> 예금주 이문회</span>
    <button type="button" id="copyAcct">계좌 복사</button>
  </div>
  <nav id="tabs">
    <button data-tab="book" class="on">예약하기</button>
    <button data-tab="mine">내 예약</button>
    <button data-tab="week" class="adm hide">주간 일정</button>
    <button data-tab="today" class="adm hide">하루 준비표</button>
    <button data-tab="members" class="adm hide">회원·설정</button>
    <span class="spacer"></span>
    <button data-tab="login" class="admin" id="adminTab">원장 메뉴</button>
  </nav>
</header>

<main>
  <div id="banner" class="banner hide"></div>

  <!-- 예약하기 -->
  <section id="tab-book">
    <form id="bookForm" class="card narrow" autocomplete="off">
      <h2>공방 방문 예약</h2>

      <div class="idrow">
        <div>
          <label for="fName">이름</label>
          <input id="fName" required maxlength="20" placeholder="이름" autocomplete="name">
        </div>
        <div>
          <label for="fLast4">휴대폰 뒷자리</label>
          <input id="fLast4" required inputmode="numeric" pattern="\d{4}" maxlength="4" placeholder="4자리">
        </div>
      </div>
      <div class="hint">이름과 휴대폰 뒷자리로 내 예약을 확인·취소할 수 있어요.</div>

      <label for="fDate">방문 날짜</label>
      <input id="fDate" type="date" required>
      <div class="dateday" id="fDateDay"></div>

      <label for="fStart">방문 시간</label>
      <div class="timerow">
        <select id="fStart" required aria-label="시작 시간"></select>
        <span>~</span>
        <select id="fEnd" required aria-label="끝나는 시간"></select>
      </div>
      <div class="hint" id="fTimeHint"></div>

      <label for="fProject">무슨 작업을 할 예정인가요?</label>
      <input id="fProject" required maxlength="100" placeholder="예: 원목 도마 마감, 책장 조립">

      <label>오늘 작업 단계</label>
      <div class="chips" id="stageChips"></div>

      <label>사용할 장비 <span class="muted">(여러 개 선택)</span></label>
      <div class="chips" id="toolChips"></div>

      <div class="actions"><button class="btn block" type="submit" id="bookBtn">예약 보내기</button></div>
    </form>
  </section>

  <!-- 내 예약 -->
  <section id="tab-mine" class="hide">
    <div class="card narrow">
      <h2>내 예약 확인</h2>
      <form id="mineForm" autocomplete="off">
        <div class="idrow">
          <div><label for="qName">이름</label><input id="qName" required maxlength="20"></div>
          <div><label for="qLast4">휴대폰 뒷자리</label><input id="qLast4" required inputmode="numeric" pattern="\d{4}" maxlength="4"></div>
        </div>
        <div class="actions"><button class="btn block" type="submit">예약 조회</button></div>
      </form>
      <div id="myList" style="margin-top:12px"></div>
    </div>
  </section>

  <!-- 원장 로그인 -->
  <section id="tab-login" class="hide">
    <form id="loginForm" class="card narrow" autocomplete="off">
      <h2>원장 메뉴</h2>
      <p class="muted">원장님만 쓰는 메뉴예요. 아이디와 비밀번호를 입력하면 전체 예약과 회원을 볼 수 있어요.</p>
      <label for="adminId">아이디</label>
      <input id="adminId" required autocapitalize="off" autocorrect="off" spellcheck="false" autocomplete="username">
      <label for="pin">비밀번호</label>
      <input id="pin" type="password" required autocomplete="current-password">
      <div class="actions"><button class="btn block" type="submit" id="loginBtn">들어가기</button></div>
    </form>
  </section>

  <!-- 주간 일정 -->
  <section id="tab-week" class="hide">
    <div class="card">
      <div class="weekbar">
        <button class="btn ghost sm" id="wPrev">◀ 이전 주</button>
        <strong id="wLabel"></strong>
        <button class="btn ghost sm" id="wNext">다음 주 ▶</button>
        <button class="btn ghost sm" id="wToday">이번 주</button>
        <button class="btn ghost sm right" data-refresh>새로고침</button>
      </div>
      <div class="grid" id="weekGrid"></div>
      <p class="muted" style="margin-top:12px">카드를 누르면 상세 내용 확인, 상태 변경(준비 확인/완료/취소), 메모를 남길 수 있어요.</p>
    </div>
  </section>

  <!-- 하루 준비표 -->
  <section id="tab-today" class="hide">
    <div class="card">
      <div class="weekbar">
        <button class="btn ghost sm" id="dPrev">◀</button>
        <input type="date" id="dDate">
        <button class="btn ghost sm" id="dNext">▶</button>
        <button class="btn ghost sm" id="dToday">오늘</button>
        <button class="btn ghost sm right" data-refresh>새로고침</button>
      </div>
      <h3 id="dTitle"></h3>
      <div class="sum" id="dSummary"></div>
      <div id="dList" style="margin-top:12px"></div>
    </div>
  </section>

  <!-- 회원·설정 -->
  <section id="tab-members" class="hide">
    <div class="two">
      <div class="card">
        <h2>회원 목록 <span class="muted" id="mCount"></span></h2>
        <input id="mSearch" placeholder="이름으로 찾기" style="margin:8px 0">
        <div style="overflow-x:auto">
          <table>
            <thead><tr><th>이름</th><th>방문 완료</th><th>다음 예약</th><th>최근 작업</th></tr></thead>
            <tbody id="mBody"></tbody>
          </table>
        </div>
      </div>
      <div class="stack">
        <form class="card" id="mForm" autocomplete="off">
          <h2>회원 추가</h2>
          <div class="idrow">
            <div><label for="mName">이름</label><input id="mName" required maxlength="20"></div>
            <div><label for="mLast4">휴대폰 뒷자리</label><input id="mLast4" required inputmode="numeric" pattern="\d{4}" maxlength="4"></div>
          </div>
          <label for="mPhone">연락처</label><input id="mPhone" type="tel" placeholder="010-">
          <label for="mMemo">메모</label><input id="mMemo" placeholder="수업 단계, 관심 작품 등">
          <div class="actions"><button class="btn" type="submit">추가</button></div>
        </form>
        <form class="card" id="sForm">
          <h2>공방 설정</h2>
          <label for="sCap">같은 시간 최대 인원</label><input id="sCap" type="number" min="1" max="50" inputmode="numeric">
          <label for="sOpen">운영 시간</label>
          <div class="timerow"><select id="sOpen"></select><span>~</span><select id="sClose"></select></div>
          <label for="sTools">장비 목록 <span class="muted">(쉼표로 구분)</span></label><textarea id="sTools"></textarea>
          <div class="actions"><button class="btn" type="submit">저장</button><button class="btn ghost" type="button" id="logout">원장 메뉴 나가기</button></div>
          <p class="muted" id="whoami" style="margin-top:12px"></p>
        </form>
      </div>
    </div>
  </section>
</main>

<div class="modal-bg" id="modalBg"><div class="modal" id="modal"></div></div>
<div class="toast" id="toast"></div>

<script src="config.js"></script>
<script src="core.js"></script>
<script>
(() => {
  const STATUS = { booked: "예약됨", confirmed: "준비 확인", done: "작업 완료", cancelled: "취소" };
  const DAYS = ["일", "월", "화", "수", "목", "금", "토"];
  const API_URL = ((window.APP_CONFIG || {}).API_URL || "").trim();
  const DEMO = !API_URL;
  const ADMIN_TABS = ["week", "today", "members"];

  const $ = (s) => document.querySelector(s);
  const state = { config: null, bookings: [], members: [], slots: {} };
  const ui = { tab: "book", weekStart: mondayOf(new Date()), day: ymd(new Date()), stage: null, tools: new Set(), pin: null, adminId: null, adminName: "" };

  // ---------- 작은 도구들 ----------
  function ymd(d) { const z = (n) => String(n).padStart(2, "0"); return `${d.getFullYear()}-${z(d.getMonth() + 1)}-${z(d.getDate())}`; }
  function parse(s) { const [y, m, d] = s.split("-").map(Number); return new Date(y, m - 1, d); }
  function addDays(s, n) { const d = parse(s); d.setDate(d.getDate() + n); return ymd(d); }
  function mondayOf(d) { const x = new Date(d); x.setDate(x.getDate() - ((x.getDay() + 6) % 7)); return ymd(x); }
  function pretty(s) { const d = parse(s); return `${d.getMonth() + 1}/${d.getDate()}(${DAYS[d.getDay()]})`; }
  function longDate(s) { const d = parse(s); return `${d.getFullYear()}년 ${d.getMonth() + 1}월 ${d.getDate()}일 (${DAYS[d.getDay()]}요일)`; }
  const today = () => ymd(new Date());
  const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  const toMin = (t) => { const [h, m] = t.split(":").map(Number); return h * 60 + m; };
  const fromMin = (n) => `${String(Math.floor(n / 60)).padStart(2, "0")}:${String(n % 60).padStart(2, "0")}`;
  function label(t) { const m = toMin(t), h = Math.floor(m / 60); const hh = h % 12 === 0 ? 12 : h % 12; return `${h < 12 ? "오전" : "오후"} ${hh}시${m % 60 ? " 30분" : ""}`; }
  function times(open, close) { const a = []; for (let m = toMin(open); m <= toMin(close); m += 30) a.push(fromMin(m)); return a; }
  const timeOpts = (list, ph) => `<option value="">${ph}</option>` + list.map((t) => `<option value="${t}">${t} (${label(t)})</option>`).join("");
  const byWhen = (a, b) => (a.date + a.start).localeCompare(b.date + b.start);
  const active = (b) => b.status !== "cancelled";
  const store = { get(k) { try { return localStorage.getItem(k); } catch (e) { return null; } }, set(k, v) { try { localStorage.setItem(k, v); } catch (e) {} } };
  const sess = { get(k) { try { return sessionStorage.getItem(k); } catch (e) { return null; } }, set(k, v) { try { v == null ? sessionStorage.removeItem(k) : sessionStorage.setItem(k, v); } catch (e) {} } };

  function toast(msg, ms = 2600) { const t = $("#toast"); t.textContent = msg; t.classList.add("show"); clearTimeout(t._h); t._h = setTimeout(() => t.classList.remove("show"), ms); }
  function banner(t) { const b = $("#banner"); b.textContent = t; b.classList.toggle("hide", !t); }

  $("#copyAcct").addEventListener("click", async () => {
    try { await navigator.clipboard.writeText("농협 356-0252-9362-53 이문회"); toast("계좌번호를 복사했어요"); }
    catch (e) { toast("복사가 안 되면 계좌번호를 길게 눌러 복사해 주세요"); }
  });

  // ---------- 서버 연결 ----------
  // 체험 모드: 이 브라우저 안에만 저장 (서버 코드와 같은 core.js 로 처리)
  function demoDb() {
    const KEY = "woodshop-standalone-demo";
    let d; try { d = JSON.parse(store.get(KEY)) || null; } catch (e) { d = null; }
    d = d || { bookings: [], members: [], config: null };

      rows: (t) => d[t].map((r) => ({ ...r })),
      insert: (t, o) => { d[t].push({ ...o }); save(); },
      update: (t, id, p) => { const r = d[t].find((x) => x.id === id); if (r) Object.assign(r, p); save(); },
      remove: (t, id) => { d[t] = d[t].filter((x) => x.id !== id); save(); },
      getConfig: () => d.config, setConfig: (c) => { d.config = c; save(); },

      <div class="actions"><button class="btn" data-save>저장</button><button class="btn danger sm" data-del>회원 삭제</button></div>
      <h3>작업 기록 (${hist.length})</h3>
      ${hist.length ? hist.map((b) => `<div class="item"><div class="who">${pretty(b.date)}<div class="meta">${b.start}~${b.end}</div></div><div class="what"><b>${esc(b.project)}</b> ${b.stage ? `<span class="tag">${esc(b.stage)}</span>` : ""} <span class="tag s-${b.status}">${STATUS[b.status]}</span>${b.ownerNote ? `<div class="meta">메모: ${esc(b.ownerNote)}</div>` : ""}</div></div>`).join("") : `<div class="empty">아직 기록이 없어요</div>`}`;
    openModal(async (t) => {
      if ("save" in t.dataset) return (await busy(t, () => adminDo("saveMember", { id, name: m.name, last4: m.last4, phone: $("#eqPhone").value.trim(), memo: $("#eqMemo").value.trim() }, "저장했어요"))) && closeModal();
      if ("del" in t.dataset) {
        if (!t.dataset.armed) { t.dataset.armed = "1"; t.textContent = "한 번 더 누르면 삭제"; return; }
        return (await busy(t, () => adminDo("deleteMember", { id }, "회원을 삭제했어요 (예약 기록은 남아요)"))) && closeModal();
      }
    });
  }

  // ---------- 시작 ----------
  async function init() {
    if (DEMO) banner("체험 모드: 아직 구글 시트에 연결되지 않아 이 기기에만 저장돼요. (원장 메뉴: 아이디 kommy9 또는 wood77, 비밀번호 1234)");
    let who = null; try { who = JSON.parse(sess.get("woodshop-admin")); } catch (e) {}
    try { state.config = await api("config"); }
    catch (err) { banner("예약 서버에 연결하지 못했어요. 잠시 후 새로고침해 주세요. (" + err.message + ")"); return; }
    fillStart(); renderBook(); loadSlots(fDate.value);
    if (who && who.pin) setAdmin(who);
  }
  init();
})();
</script>
</body>
</html>
